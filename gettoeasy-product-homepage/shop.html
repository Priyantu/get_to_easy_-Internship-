<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get To Easy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --green: #19b298;
      --green-dark: #0d8d7d;
      --line: #dde3e6;
      --bg: #f4f6f8;
      --text: #222;
      --muted: #8a8f94;
      --card: #ffffff;
      --danger: #ff3b30;
      --star: #f5b301;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .header-bar {
      background: #f5f7f8;
      border-bottom: 1px solid var(--line);
      padding: 18px 0;
    }

    .home-shell {
      max-width: 1400px;
      margin: 18px auto 40px;
      padding: 0 18px;
    }

    .section-wrap {
      background: #f8f8f8;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px 18px 12px;
      margin-bottom: 28px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      margin-bottom: 18px;
      border-bottom: 2px solid var(--green);
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.7rem, 2vw, 2.3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-btn {
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      padding: 12px 22px;
      font-size: 1.05rem;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(25,178,152,0.2);
    }

    .view-btn:hover {
      background: var(--green-dark);
    }

    .carousel {
      position: relative;
      overflow: hidden;
      padding: 0 28px;
    }

    .track {
      display: flex;
      gap: 16px;
      transition: transform 0.25s ease;
      will-change: transform;
    }

    .card {
      flex: 0 0 calc((100% - 64px) / 5);
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      overflow: hidden;
      position: relative;
    }

    .image-box {
      position: relative;
      height: 255px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 8px rgba(0,0,0,0.08));
    }

    .badge-wrap {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }

    .off-badge,
    .cod-badge,
    .stock-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-weight: 700;
      line-height: 1;
    }

    .off-badge {
      background: var(--danger);
      color: white;
      width: 66px;
      height: 34px;
      font-size: 0.8rem;
      padding: 0 12px;
    }

    .cod-badge {
      background: var(--green);
      color: white;
      width: 46px;
      height: 26px;
      font-size: 0.66rem;
    }

    .stock-badge {
      background: #eef1f2;
      color: #3d4043;
      padding: 8px 12px;
      font-size: 0.72rem;
      border: 1px solid #dfe5e7;
    }

    .info-box {
      padding: 16px 14px 18px;
      text-align: left;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .old-price {
      color: #8b8f95;
      text-decoration: line-through;
      font-size: 0.98rem;
      font-weight: 600;
    }

    .new-price {
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .stars {
      color: var(--star);
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      min-height: 46px;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 1px solid #d7dfe2;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      color: #3d4043;
      font-size: 2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      z-index: 9;
      cursor: pointer;
    }

    .arrow.left { left: 0; }
    .arrow.right { right: 0; }

    @media (max-width: 1100px) {
      .card { flex-basis: calc((100% - 32px) / 3); }
    }

    @media (max-width: 760px) {
      .card { flex-basis: calc((100% - 16px) / 2); }
      .section-head { align-items: flex-start; }
      .view-btn { padding: 10px 16px; }
    }

    @media (max-width: 520px) {
      .card { flex-basis: 100%; }
      .section-wrap { padding: 14px 12px 10px; }
      .carousel { padding: 0 18px; }
      .image-box { height: 210px; }
    }

    .page-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .page-nav a {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #3d4043;
      padding: 8px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
    }

    .page-nav a:hover,
    .page-nav a.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .catalog-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--green);
    }

    .catalog-heading h2 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2rem);
      font-weight: 700;
    }

    .catalog-count {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .product-grid .card {
      min-width: 0;
    }

    .product-category {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 6px;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .product-actions button {
      flex: 1 1 auto;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .product-actions button:hover,
    .product-actions button.is-selected {
      border-color: var(--green);
      color: var(--green-dark);
    }

    .catalog-message {
      grid-column: 1 / -1;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--muted);
      text-align: center;
    }

    .cart-quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-weight: 700;
    }

    .cart-quantity button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .category-card {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .category-card:hover {
      border-color: var(--green);
      color: var(--text);
      text-decoration: none;
      transform: translateY(-2px);
    }

    .category-card img {
      width: 96px;
      height: 96px;
      flex: 0 0 96px;
      object-fit: contain;
      border-radius: 8px;
      background: #f8f8f8;
    }

    .category-card h3 {
      margin: 0 0 6px;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .category-card span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 1100px) {
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 760px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .category-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .product-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="header-bar">
    <div class="container text-center">
      <h1 style="margin:0; font-size:2.4rem; font-weight:700; color:#1c1c1c;">Get To Easy</h1>
      <nav class="page-nav">
        <a href="../gettoeasy-assets/homepage.html">Home</a>
        <a href="shop.html">All Products</a>
        <a href="shop.html?filter=sale">Flash Sales</a>
        <a href="shop.html?filter=categories">All Categories</a>
        <a href="shop.html?view=compare">Compare <span class="local-compare-count">0</span></a>
        <a href="shop.html?view=wishlist">Wishlist <span class="local-wishlist-count">0</span></a>
        <a href="shop.html?view=cart">Cart <span class="local-cart-count">0</span></a>
        <a href="product-gallery.html">Gallery</a>
      </nav>
    </div>
  </header>

  <main class="home-shell" id="catalog"></main>

  <script src="../javascript/gettoeasy-product-homepage/products.js"></script>
  <script src="../javascript/gettoeasy-product-homepage/shop.js"></script>
</body>
</html>
